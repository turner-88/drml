{{define "content"}}
<div class="flex items-center gap-3 mb-6 lg:hidden">
  <div class="brand-mark"><i data-lucide="eye"></i></div>
  <div>
    <div class="font-heading font-bold leading-tight" style="color:var(--color-ink)">DRML</div>
    <div class="text-xs text-base-content/55">Screening Retinopati Diabetik</div>
  </div>
</div>

<h1 class="text-2xl font-bold">Masuk</h1>
<p class="page-subtitle mb-6">Silakan masuk menggunakan akun yang telah didaftarkan oleh administrator.</p>

{{if .Error}}
<div role="alert" class="alert alert-error mb-4">
  <i data-lucide="alert-circle"></i>
  <span>{{.Error}}</span>
</div>
{{end}}

<form method="post" action="/login" class="flex flex-col gap-4">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

  <div class="field">
    <span class="label-text">Username</span>
    <label class="input">
      <i data-lucide="user" class="w-4 h-4 text-base-content/40"></i>
      <input type="text" name="username" value="{{.Username}}" required autofocus
             autocomplete="username" placeholder="Masukkan username">
    </label>
  </div>

  <div class="field">
    <span class="label-text">Password</span>
    <label class="input">
      <i data-lucide="lock" class="w-4 h-4 text-base-content/40"></i>
      <input type="password" name="password" required autocomplete="current-password"
             placeholder="Masukkan password">
    </label>
  </div>

  <button type="submit" class="btn btn-primary w-full mt-2">
    <i data-lucide="log-in"></i> Masuk
  </button>
</form>

<p class="hint mt-6 text-center">Alat bantu screening — bukan pengganti diagnosis medis.</p>
{{end}}
