version: "2"
sql:
  - engine: "mysql"
    queries: "internal/database/query"
    # schema.sql alone, not the whole directory: the dated files beside it are
    # upgrade steps for existing deployments, and replaying them over a schema
    # that already includes their columns is not something sqlc can make sense
    # of. schema.sql stays the authoritative definition of the current shape.
    schema: "internal/database/migration/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
